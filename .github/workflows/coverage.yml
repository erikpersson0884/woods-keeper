name: Test Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip flask python-dotenv coverage

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=app,storage -m unittest discover -s tests
          python -m coverage report -m | tee coverage-report.txt

      - name: Calculate coverage
        id: coverage
        run: |
          COVERAGE=$(awk '$1 == "TOTAL" {gsub("%", "", $4); print $4}' coverage-report.txt)
          if [ -z "$COVERAGE" ]; then
            echo "Could not determine total coverage"
            exit 1
          fi
          echo "Coverage: $COVERAGE%"
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Generate coverage data
        run: |
          COVERAGE="${{ steps.coverage.outputs.percentage }}"

          if [ "$COVERAGE" -ge 80 ]; then COLOR=brightgreen
          elif [ "$COVERAGE" -ge 60 ]; then COLOR=yellow
          else COLOR=red
          fi

          cat > /tmp/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: /tmp/coverage.json

  update-coverage-branch:
    if: github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: /tmp

      - name: Update coverage branch
        run: |
          git fetch origin coverage || true

          if git show-ref --verify --quiet refs/remotes/origin/coverage; then
            git checkout -B coverage origin/coverage --
          else
            git checkout --orphan coverage --
            git rm -rf .
          fi

          mkdir -p .github
          cp /tmp/coverage.json .github/coverage.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/coverage.json

          if git diff --cached --quiet; then
            echo "Coverage badge has not changed"
          else
            git commit -m "chore: update coverage data"
            git push origin HEAD:refs/heads/coverage
          fi
