<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dashboard settings - Stack Manager</title>
    <link rel="icon" href="/favicon.ico" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main class="settings-page">
    <header class="top">
        <div>
            <h1>Dashboard settings</h1>
            <div class="conn">Choose the dashboard appearance and what is shown. Saved in this browser.</div>
        </div>
        <div class="header-actions">
            <a class="theme-toggle" href="/">Back to dashboard</a>
        </div>
    </header>
    <section class="stack-card settings-list">
        <h2>Appearance</h2>
        <label class="setting-row" for="theme-select">Color theme
            <select id="theme-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </label>
        <label class="setting-row" for="style-select">Dashboard style
            <select id="style-select">
                <option value="default">Default</option>
                <option value="hud">HUD</option>
            </select>
        </label>
        <h2>Dashboard content</h2>
        <label class="switch">Show webhook repositories
            <input type="checkbox" id="pref-webhooks" data-pref="showWebhooks" checked><i></i>
        </label>
        <label class="switch">Show "Skip global updates" toggle for every repo
            <input type="checkbox" id="pref-skip" data-pref="showSkip" checked><i></i>
        </label>
    </section>
</main>
<script src="{{ url_for('static', filename='appearance.js', v='20261119-1') }}"></script>
<script>
    (function () {
        const KEY = 'dashboardPrefs';
        let prefs = {};
        try { prefs = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (error) { prefs = {}; }
        document.querySelectorAll('[data-pref]').forEach(input => {
            input.checked = prefs[input.dataset.pref] !== false;
            input.addEventListener('change', () => {
                prefs[input.dataset.pref] = input.checked;
                localStorage.setItem(KEY, JSON.stringify(prefs));
            });
        });
    })();
</script>
</body>
</html>
