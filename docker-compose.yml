version: '3.8'

services:
  portainer-updater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portainer-updater
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORTAINER_URL=${PORTAINER_URL:?Set PORTAINER_URL to an HTTPS Portainer URL}
      - ALLOW_INSECURE_PORTAINER_HTTP=${ALLOW_INSECURE_PORTAINER_HTTP:-false}
      - API_KEY=${API_KEY:?Set API_KEY through your environment or a secret manager}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Set ADMIN_USERNAME through your environment}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD through your environment}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_WEBHOOK_STACKS=${GITHUB_WEBHOOK_STACKS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock       # Needed to inspect/pull docker images
      - updater_data:/app/data

volumes:
  updater_data:
